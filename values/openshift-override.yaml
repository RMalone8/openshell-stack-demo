# Applied after the chart's ci/values-openshift-scc.yaml (see scripts/01-install-openshell.sh).

server:
  # Plaintext gateway, reached through `oc port-forward`. Use mTLS/OIDC and a Route for anything shared.
  disableTls: true
  dataStorageSize: 5Gi

# The openshell CLI calls the gateway without credentials. Unsafe outside a trusted
# environment: anything that can reach Service/openshell can create sandboxes.
gatewayConfig:
  openshell.gateway.auth:
    allow_unauthenticated_users: true
