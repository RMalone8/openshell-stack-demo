apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openshell-demo
resources:
  - launcher.yaml
  - vllm-gpu-inferenceservice.yaml
  - vllm-gpu-servingruntime.yaml
  - praxis.yaml

configMapGenerator:
  - name: openclaw-launcher
    files:
      - launcher/launch.py
      - launcher/policy.json
  - name: openclaw-model
    literals:
      - VLLM_BASE_URL=http://praxis.openshell-demo.svc.cluster.local:80/v1
      - VLLM_MODEL_ID=qwen25-7b
