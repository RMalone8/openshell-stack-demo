apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-launcher
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: openclaw-launcher}}
  template:
    metadata: {labels: {app: openclaw-launcher}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: launcher
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["sh", "-c", "pip install --quiet --target /tmp/pylib openshell && PYTHONPATH=/tmp/pylib python /app/launch.py && exec sleep infinity"]
          env:
            - {name: HOME, value: /tmp}
            - {name: OPENSHELL_ENDPOINT, value: "openshell.openshell-demo.svc:8080"}
            - {name: FORCE_RECREATE, value: "false"}
          envFrom:
            - configMapRef: {name: openclaw-model}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: openclaw-launcher}}]
